<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Adicionando o Bootstrap via CDN com o jsDelivr -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
    
    <title>Containers</title>
</head>
<body>
    
    <div class="container bg-primary">
        <h1>
            a classe <code>.container</code> fornece um contêiner responsivo de largura fixa.
        </h1>
    </div>
    <br>
    <div class="container-fluid bg-primary">
        <h1>
            A <code>.container-fluid</code> fornece um contêiner de largura total, abrangendo toda a largura da janela de visualização.
        </h1>
    </div>



    <!-- Adicionando o JavaScript via CDN com o jsDelivr-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
